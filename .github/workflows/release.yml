name: Release

on:
  push:
    branches: [main]

# Never let two releases race for the same version number.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Version, package and publish
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.version.outputs.bump }}
      version: ${{ steps.version.outputs.version }}
    # The job pushes only a tag, never a commit to main, so it cannot retrigger
    # itself. This guard is kept as a backstop in case a version-bump commit is
    # ever reintroduced.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from the commits since the last tag, so the
          # full history and all tags have to be present.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # main should already be green, but a merge can combine two individually
      # passing branches into a broken one. Nothing gets a version number until
      # it passes the same gates a PR does.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Extension permission guard
        run: npm run check:permissions

      - name: Cache vendored Tesseract runtime
        uses: actions/cache@v4
        with:
          path: vendor
          key: tesseract-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/vendor.mjs') }}

      - name: Vendor Tesseract runtime
        run: npm run vendor

      - name: OCR integration test
        run: npm run test:integration

      # feat: -> minor, fix:/perf: -> patch, ! or BREAKING CHANGE -> major,
      # anything else -> no release at all.
      - name: Resolve next version
        id: version
        run: node scripts/release-version.mjs --apply

      - name: Build and package
        if: steps.version.outputs.bump != 'none'
        id: package
        run: npm run package

      # Tag only — nothing is pushed back to main.
      #
      # main is governed by a ruleset requiring every change to arrive through a
      # pull request with verified signatures. A bot pushing a version-bump commit
      # directly satisfies neither, so the version lives in the tag and in the
      # packaged artifact. The manifest.json edit made above stays in the working
      # tree, reaches the build, and is then discarded with the runner.
      - name: Tag the release
        if: steps.version.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      # Notes are built here rather than with --generate-notes so the first
      # release (which has no previous tag to diff against) works identically
      # to every later one.
      - name: Write release notes
        if: steps.version.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.version.outputs.bump }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "v${VERSION}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..v${VERSION}"
            echo "## Changes since ${PREV_TAG}" > notes.md
          else
            RANGE="v${VERSION}"
            echo "## Changes" > notes.md
          fi
          echo "" >> notes.md
          git log "$RANGE" --no-merges --format='- %s (%h)' \
            --grep='^chore(release):' --invert-grep >> notes.md
          cat >> notes.md <<'EOF'

          ## Install

          The attached zip is the unpacked extension. Upload it to the Chrome Web Store,
          or extract it and load it via `chrome://extensions` → Load unpacked.

          ## Verification status

          Built, linted and tested automatically, including a real OCR pass against a
          golden image. There is no automated browser test for this extension — layout,
          painting, text selection and clipboard behaviour are all unverifiable in CI.
          See `docs/manual-test-checklist.md` for what still needs a human.
          EOF

      - name: Publish GitHub release
        if: steps.version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.version.outputs.bump }}
        run: |
          gh release create "v${VERSION}" \
            "release/video-text-select-${VERSION}.zip" \
            --title "v${VERSION} (${BUMP})" \
            --notes-file notes.md

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.version.outputs.bump }}" = "none" ]; then
            echo "No release-worthy commits since the last tag — nothing published." >> $GITHUB_STEP_SUMMARY
          else
            echo "Released **v${{ steps.version.outputs.version }}** (${{ steps.version.outputs.bump }} bump from ${{ steps.version.outputs.previous }})." >> $GITHUB_STEP_SUMMARY
          fi

  # Auto-publish to the Chrome Web Store on every release.
  #
  # A separate job rather than extra steps on `release`, for two reasons: a store
  # outage or an expired token can be re-run from the Actions tab without cutting
  # another release, and a publishing failure cannot leave the GitHub release
  # half-created.
  #
  # Publishing submits for Google's review and, once approved, pushes to every
  # existing user. Nothing reaches the store unless `release` fully succeeded,
  # which means lint, the unit suite, the real-OCR integration test and the
  # permission guard all passed first.
  publish-store:
    name: Publish to the Chrome Web Store
    needs: release
    if: needs.release.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Take the exact artifact that was attached to the release, rather than
      # rebuilding it — publishing something that was never released would make
      # the tag a lie.
      - name: Download the released package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release download "v${VERSION}" \
            --pattern "video-text-select-${VERSION}.zip" \
            --dir release
          ls -l release

      - name: Upload and publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/publish-webstore.mjs "release/video-text-select-${VERSION}.zip"
